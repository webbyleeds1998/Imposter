<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1e22">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Imposter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: one centred phone-width column; neutral graphite by default, each category swaps in its own theme (football = striped pitch). */
:root {
  --bg: #1d1e22;
  --bg-image: radial-gradient(120% 60% at 50% 0%, #26272c 0%, #1d1e22 70%);
  --panel: rgba(0, 0, 0, .22);
  --card-sub: #5b5d66;
  --chalk: #f3f1e8;
  --chalk-dim: rgba(243, 241, 232, .68);
  --chalk-faint: rgba(243, 241, 232, .14);
  --yellow: #f6c90e;
  --red: #e23b2e;
  --ink: #121316;
  --card: #f3f1e8;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-label: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background-color: var(--bg);
  background-image: var(--bg-image);
  transition: background-color .4s ease;
  color: var(--chalk);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100%;
  box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 96px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 900; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; }
.brand span { color: var(--red); }
.icon-btn {
  background: transparent; border: 1.5px solid var(--chalk-faint); color: var(--chalk);
  border-radius: 999px; padding: 6px 12px; font: 600 14px var(--font-label); letter-spacing: .06em; text-transform: uppercase; cursor: pointer;
}
.screen { display: flex; flex-direction: column; gap: 18px; flex: 1; animation: rise .35s ease both; }
@keyframes rise { from { opacity: .001; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.eyebrow { font: 700 14px var(--font-label); letter-spacing: .14em; text-transform: uppercase; color: var(--yellow); margin: 0; }
h1, h2 { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; line-height: .92; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(64px, 22vw, 108px); letter-spacing: .01em; }
h2 { font-size: clamp(38px, 11vw, 54px); }
p { margin: 0; }
.lede { color: var(--chalk-dim); font-size: 18px; max-width: 34ch; }
.muted { color: var(--chalk-dim); }
.spacer { flex: 1; }

.btn {
  display: block; width: 100%; box-sizing: border-box; border: 0; border-radius: 14px; cursor: pointer;
  padding: 17px 20px; font: 700 20px var(--font-label); letter-spacing: .08em; text-transform: uppercase;
  background: var(--yellow); color: var(--ink); transition: transform .08s ease, filter .15s ease;
}
.btn:active { transform: scale(.98); }
.btn:disabled { filter: grayscale(1) brightness(.6); cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--chalk); border: 2px solid var(--chalk-faint); }
.btn.red { background: var(--red); color: var(--chalk); }
.btn.light { background: var(--chalk); color: var(--ink); }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }

/* Home */
.hero-mark { display: flex; gap: 8px; align-items: center; }
.mini-card { width: 22px; height: 30px; border-radius: 3px; transform: rotate(-8deg); }
.mini-card.y { background: var(--yellow); }
.mini-card.r { background: var(--red); transform: rotate(6deg); }
.rules { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; counter-reset: step; }
.rules li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; color: var(--chalk-dim); }
.rules li::before {
  counter-increment: step; content: counter(step);
  font: 900 22px/1 var(--font-display); color: var(--chalk); border-bottom: 2px solid var(--yellow); padding-bottom: 2px; text-align: center;
}
.rules b { color: var(--chalk); font-weight: 600; }

/* Setup */
.panel { background: var(--panel); border: 1.5px solid var(--chalk-faint); border-radius: 16px; padding: 16px; display: grid; gap: 12px; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.label { font: 700 14px var(--font-label); letter-spacing: .12em; text-transform: uppercase; color: var(--chalk-dim); }
.players { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.players li { display: flex; align-items: center; gap: 10px; background: var(--chalk-faint); border-radius: 10px; padding: 10px 10px 10px 14px; }
.players .num { font: 900 18px var(--font-display); color: var(--yellow); width: 22px; font-variant-numeric: tabular-nums; }
.players .pname { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.remove { background: transparent; border: 0; color: var(--chalk-dim); font-size: 22px; line-height: 1; cursor: pointer; padding: 4px 8px; border-radius: 8px; }
.add-row { display: flex; gap: 8px; }
.add-row input {
  flex: 1; min-width: 0; font: 500 17px var(--font-body); padding: 12px 14px; border-radius: 10px;
  border: 1.5px solid var(--chalk-faint); background: var(--ink); color: var(--chalk);
}
.add-row button { flex: none; width: auto; padding: 12px 18px; font-size: 17px; border-radius: 10px; }
.hint { font-size: 14px; color: var(--chalk-dim); }
.hint.warn { color: var(--yellow); }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.cat-tile {
  display: grid; gap: 4px; text-align: left; cursor: pointer; padding: 14px; border-radius: 12px;
  background: var(--chalk-faint); color: var(--chalk); border: 2px solid transparent; font: inherit;
}
.cat-tile .t { font: 900 24px/1 var(--font-display); text-transform: uppercase; }
.cat-tile .c { font-size: 14px; color: var(--chalk-dim); }
.cat-tile[aria-pressed="true"] { border-color: var(--yellow); background: var(--panel); }
select {
  font: 600 17px var(--font-body); padding: 12px 14px; border-radius: 10px; width: 100%;
  border: 1.5px solid var(--chalk-faint); background: var(--ink); color: var(--chalk);
}
.stepper { display: flex; align-items: center; gap: 14px; }
.stepper button { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--chalk-faint); background: transparent; color: var(--chalk); font-size: 22px; cursor: pointer; }
.stepper output { font: 900 32px var(--font-display); min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; }

/* Reveal */
.pass { text-align: center; align-items: center; justify-content: center; }
.pass .who { font-family: var(--font-display); font-weight: 900; font-size: clamp(52px, 16vw, 84px); text-transform: uppercase; line-height: .95; overflow-wrap: anywhere; }
.progress-dots { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.progress-dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--chalk-faint); }
.progress-dots i.done { background: var(--yellow); }
.flip { perspective: 1200px; width: min(300px, 78vw); aspect-ratio: 5 / 7; max-width: 100%; margin: 0 auto; }
.flip-inner { position: relative; width: 100%; height: 100%; transition: transform .6s cubic-bezier(.2, .8, .2, 1); transform-style: preserve-3d; }
.flip.on .flip-inner { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; border-radius: 18px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 22px; box-sizing: border-box; text-align: center;
  box-shadow: 0 18px 40px rgba(0, 0, 0, .35);
}
.face.back { background: var(--ink); border: 2px solid var(--chalk-faint); }
.face.back .q { font: 900 120px/1 var(--font-display); color: var(--yellow); }
.face.front { transform: rotateY(180deg); }
.face.safe { background: var(--card); color: var(--ink); }
.face.safe .tag { font: 700 14px var(--font-label); letter-spacing: .14em; text-transform: uppercase; color: var(--card-sub); }
.face.safe .secret { font: 900 clamp(40px, 12vw, 54px)/.95 var(--font-display); text-transform: uppercase; overflow-wrap: anywhere; }
.face.safe .cat { font-size: 15px; color: var(--card-sub); }
.face.imp { background: var(--red); color: var(--chalk); }
.face.imp .secret { font: 900 clamp(44px, 13vw, 60px)/.92 var(--font-display); text-transform: uppercase; }
.face.imp .tag { font: 700 14px var(--font-label); letter-spacing: .14em; text-transform: uppercase; }

/* Clues */
.round-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
.round-pips { display: flex; gap: 6px; }
.round-pips i { width: 26px; height: 8px; border-radius: 4px; background: var(--chalk-faint); }
.round-pips i.done { background: var(--yellow); }
.round-pips i.now { background: var(--chalk); }
.speaker { background: var(--chalk); color: var(--ink); border-radius: 18px; padding: 22px 20px; display: grid; gap: 6px; }
.speaker .label { color: var(--card-sub); }
.speaker .who { font: 900 clamp(46px, 14vw, 68px)/.95 var(--font-display); text-transform: uppercase; overflow-wrap: anywhere; }
.order { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.order li { display: flex; gap: 12px; align-items: center; padding: 8px 12px; border-radius: 10px; color: var(--chalk-dim); }
.order li.now { background: var(--chalk-faint); color: var(--chalk); font-weight: 600; }
.order li.done { text-decoration: line-through; text-decoration-color: var(--chalk-faint); }
.order .n { font: 900 16px var(--font-display); width: 18px; color: var(--yellow); font-variant-numeric: tabular-nums; }
.text-link { background: none; border: 0; color: var(--chalk-dim); text-decoration: underline; text-underline-offset: 3px; font: 500 15px var(--font-body); cursor: pointer; padding: 8px; align-self: center; }

/* Vote */
.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.choice {
  background: var(--chalk-faint); color: var(--chalk); border: 2px solid transparent; border-radius: 14px; padding: 16px 12px;
  font: 700 19px var(--font-body); cursor: pointer; overflow-wrap: anywhere; text-align: center;
}
.choice:active { border-color: var(--yellow); }
.tally { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.tally li { display: grid; grid-template-columns: minmax(0, 7.5em) 1fr 2ch; gap: 10px; align-items: center; }
.tally .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tally .bar { height: 14px; border-radius: 7px; background: var(--chalk-faint); overflow: hidden; }
.tally .bar span { display: block; height: 100%; background: var(--yellow); border-radius: 7px; transform-origin: left; animation: grow .6s ease both; }
.tally li.top .bar span { background: var(--red); }
.tally .ct { font: 900 20px var(--font-display); text-align: right; font-variant-numeric: tabular-nums; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

/* Result */
.verdict { border-radius: 20px; padding: 24px 20px; display: grid; gap: 10px; text-align: center; }
.verdict.imp-win { background: var(--red); color: var(--chalk); }
.verdict.safe-win { background: var(--chalk); color: var(--ink); }
.verdict .big { font: 900 clamp(46px, 14vw, 66px)/.92 var(--font-display); text-transform: uppercase; }
.stamp { animation: stamp .5s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes stamp { from { transform: scale(1.4) rotate(-4deg); opacity: .001; } to { transform: none; opacity: 1; } }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: baseline; }
.facts dt { font: 700 13px var(--font-label); letter-spacing: .12em; text-transform: uppercase; color: var(--chalk-dim); }
.facts dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.table { width: 100%; border-collapse: collapse; }
.table td { padding: 8px 4px; border-bottom: 1px solid var(--chalk-faint); }
.table td:last-child { text-align: right; font: 900 20px var(--font-display); font-variant-numeric: tabular-nums; }
.answer-card { background: var(--chalk); color: var(--ink); border-radius: 18px; padding: 22px; text-align: center; display: grid; gap: 6px; }
.answer-card .secret { font: 900 clamp(40px, 12vw, 56px)/.95 var(--font-display); text-transform: uppercase; overflow-wrap: anywhere; }

/* Confirm overlay */
.sheet-wrap { position: fixed; inset: 0; background: rgba(0, 0, 0, .65); display: flex; align-items: flex-end; justify-content: center; z-index: 20; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet { background: var(--ink); border: 1.5px solid var(--chalk-faint); border-radius: 18px 18px 0 0; width: 100%; max-width: 480px; box-sizing: border-box; padding: 22px max(16px, env(safe-area-inset-right, 0px)) 22px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }

/* Host */
.host { display: flex; gap: 10px; align-items: flex-end; text-align: left; width: 100%; }
.host-fig { width: 96px; flex: none; animation: bob 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
.host-fig svg { display: block; width: 100%; height: auto; overflow: visible; }
.host .arm-up { transform-origin: 78px 96px; animation: raise .5s cubic-bezier(.2, 1.4, .4, 1) .15s both; }
.bubble {
  position: relative; flex: 1; min-width: 0; margin-bottom: 22px;
  background: var(--chalk); color: var(--ink); border-radius: 16px; padding: 10px 14px 12px;
  font-size: 16px; font-weight: 500; line-height: 1.35; animation: pop .35s cubic-bezier(.2, 1.3, .4, 1) both;
}
.bubble::before {
  content: ""; position: absolute; left: -8px; bottom: 14px;
  border-style: solid; border-width: 7px 10px 7px 0; border-color: transparent var(--chalk) transparent transparent;
}
.bubble .host-name { display: block; font: 700 12px var(--font-label); letter-spacing: .14em; text-transform: uppercase; color: var(--card-sub); margin-bottom: 2px; }
.bubble b { font-weight: 700; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-3px) rotate(-1.5deg); } }
@keyframes pop { from { opacity: .001; transform: scale(.85) translateX(-6px); } to { opacity: 1; transform: none; } }
@keyframes raise { from { transform: rotate(60deg); } to { transform: none; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; transition-duration: .001s !important; }
}
</style>
</head>

const DEFAULT_ROUNDS = 3;
const MIN_PLAYERS = 3;

/* ---------- storage (per-device convenience only) ---------- */
const store = {
  get(k, fallback) { try { const v = localStorage.getItem("imposter:" + k); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } },
  set(k, v) { try { localStorage.setItem("imposter:" + k, JSON.stringify(v)); } catch (e) {} }

/* ---------- sound (Web Audio, starts after first tap) ---------- */
const sound = {
  on: store.get("sound", true),
  ctx: null,
  ensure() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (this.ctx && this.ctx.state === "suspended") this.ctx.resume(); return this.ctx; },
  tone(freq, start, dur, type = "sine", vol = .18) {
    const c = this.ensure(); if (!c || !this.on) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, c.currentTime + start);
    g.gain.linearRampToValueAtTime(vol, c.currentTime + start + .01);
    g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + start + dur);
    o.connect(g).connect(c.destination); o.start(c.currentTime + start); o.stop(c.currentTime + start + dur + .05);
    return o;
  },
  tap() { this.tone(660, 0, .06, "triangle", .08); },
  whistle(len = .5) {
    const c = this.ensure(); if (!c || !this.on) return;
    const o = c.createOscillator(), lfo = c.createOscillator(), lg = c.createGain(), g = c.createGain();
    o.type = "sine"; o.frequency.value = 2900; lfo.frequency.value = 38; lg.gain.value = 140;
    lfo.connect(lg).connect(o.frequency);
    g.gain.setValueAtTime(0, c.currentTime); g.gain.linearRampToValueAtTime(.12, c.currentTime + .02);
    g.gain.setValueAtTime(.12, c.currentTime + len - .05); g.gain.linearRampToValueAtTime(0, c.currentTime + len);
    o.connect(g).connect(c.destination); o.start(); lfo.start(); o.stop(c.currentTime + len + .05); lfo.stop(c.currentTime + len + .05);
  },
  reveal(imp) {
    if (imp) { this.tone(220, 0, .35, "sawtooth", .12); this.tone(207, .18, .5, "sawtooth", .12); }
    else { this.tone(523, 0, .14, "triangle"); this.tone(784, .1, .22, "triangle"); }
  },
  win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, i * .11, .3, "triangle", .16)); },
  lose() { [392, 330, 262].forEach((f, i) => this.tone(f, i * .16, .35, "square", .07)); }
};

let S = {
  screen: "home",
  players: store.get("players", []),
  category: null,
  rounds: store.get("rounds", DEFAULT_ROUNDS),
  scores: store.get("scores", {}),
  used: store.get("used", {}),
  game: null
};

function save() {
  store.set("players", S.players); store.set("rounds", S.rounds);
  store.set("scores", S.scores); store.set("used", S.used);
}

const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rand = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function go(screen) { S.screen = screen; render(); window.scrollTo(0, 0); }

/* ---------- game logic ---------- */
function pickSecret(catKey) {
  const items = [...new Set(CATEGORIES[catKey].items)];
  let used = S.used[catKey] || [];
  let pool = items.filter(x => !used.includes(x));
  if (!pool.length) { used = []; pool = items; }
  const secret = pool[rand(pool.length)];
  S.used[catKey] = [...used, secret];
  return secret;
}

function newGame() {
  const players = S.players.slice();
  const imposter = rand(players.length);
  // Speaking order: fully random (the imposter can go first).
  const order = shuffle(players.map((_, i) => i));
  S.game = {
    players, imposter, secret: pickSecret(S.category), category: S.category,
    revealIdx: 0, revealOpen: false,
    order, round: 1, turn: 0,
    voteIdx: 0, votes: [], candidates: players.map((_, i) => i), revote: false,
    accused: null, outcome: null, guessed: null
  };
  save();
  go("pass");
}

function tallyVotes() {
  const g = S.game, counts = {};
  g.candidates.forEach(i => counts[i] = 0);
  g.votes.forEach(v => counts[v]++);
  const max = Math.max(...Object.values(counts));
  const top = Object.keys(counts).filter(k => counts[k] === max).map(Number);
  return { counts, max, top };
}

function finish(outcome) {
  const g = S.game; g.outcome = outcome;
  const winners = outcome === "safe" ? g.players.filter((_, i) => i !== g.imposter) : [g.players[g.imposter]];
  g.players.forEach(p => { if (!(p in S.scores)) S.scores[p] = 0; });
  winners.forEach(p => S.scores[p]++);
  save();
  outcome === "safe" ? sound.win() : sound.lose();
  go("result");
}

        <div class="round-pips" aria-hidden="true">${pips}</div>
      </div>
      ${g.round === 1 && g.turn === 0 ? host("clues1") : g.turn === 0 ? host("cluesN", [g.round]) : ""}
      <div class="speaker"><span class="label">Your turn</span><div class="who">${esc(g.players[speakerIdx])}</div><p>One word linked to the ${esc(noun())}. Don't make it too obvious.</p></div>
      <ol class="order">${list}</ol>
      <div class="spacer"></div>
      <button class="btn" data-act="next-turn">${lastTurn ? (lastRound ? "Time to vote" : `Start round ${g.round + 1}`) : "Said it, next player"}</button>
      ${!(lastTurn && lastRound) ? `<button class="text-link" data-act="skip-vote">Skip to the vote</button>` : ""}
    </section>`;
  },

  vote() {
    const g = S.game, voter = g.voteIdx, name = g.players[voter];
    const opts = g.candidates.filter(i => i !== voter);
    return `${topbar(quitBtn)}
    <section class="screen">
      <div><p class="eyebrow">${g.revote ? "Tie-break vote" : "The vote"} · ${voter + 1} of ${g.players.length}</p>
      <h2>${esc(name)}, who's the imposter?</h2></div>
      ${voter === 0 && !g.revote ? host("vote") : ""}
      <p class="muted">${g.revote ? "It was a tie. Vote again, only between the tied players." : "Say it out loud, then tap their name."}</p>
      <div class="choices">${opts.map(i => `<button class="choice" data-act="cast" data-i="${i}">${esc(g.players[i])}</button>`).join("")}</div>
    </section>`;
  },

  tally() {
    const g = S.game, t = tallyVotes();
    const max = Math.max(t.max, 1);
    const rows = g.candidates.slice().sort((a, b) => t.counts[b] - t.counts[a])
      .map(i => `<li class="${t.top.length === 1 && t.top[0] === i ? "top" : ""}"><span class="nm">${esc(g.players[i])}</span><span class="bar"><span style="width:${(t.counts[i] / max) * 100}%"></span></span><span class="ct">${t.counts[i]}</span></li>`).join("");
    let msg, btn;
    if (t.top.length === 1) {
      msg = `<b>${esc(g.players[t.top[0]])}</b> has the most votes and is accused.`;
      btn = `<button class="btn red" data-act="accuse" data-i="${t.top[0]}">Reveal ${esc(g.players[t.top[0]])}</button>`;
    } else if (!g.revote) {
      msg = `It's a tie between ${t.top.map(i => esc(g.players[i])).join(" and ")}. Everyone votes again, between them only.`;
      btn = `<button class="btn" data-act="revote">Tie-break vote</button>`;
    } else {
      msg = `Still a tie. Nobody gets accused, so the imposter slips away.`;
      btn = `<button class="btn red" data-act="hung">Reveal the imposter</button>`;
    }
    return `${topbar(quitBtn)}
    <section class="screen">
      <div><p class="eyebrow">${g.revote ? "Tie-break result" : "Votes are in"}</p><h2>The count</h2></div>
      <ul class="tally">${rows}</ul>
      ${host(t.top.length === 1 ? "tallyTop" : !g.revote ? "tallyTie" : "tallyHung", [], { extra: msg })}
      <div class="spacer"></div>
      ${btn}
    </section>`;
  },

  caught() {
    const g = S.game, imp = g.players[g.imposter];
    if (g.guessed === null) {
      return `${topbar(quitBtn)}
      <section class="screen">
        <div class="verdict imp-win stamp"><span class="eyebrow" style="color:var(--chalk)">Caught</span><div class="big">${esc(imp)} is the imposter</div></div>
        ${host("caught", [esc(imp), esc(noun())], { pose: "card" })}
        <div class="spacer"></div>
        <button class="btn" data-act="show-answer">They've guessed, show the answer</button>
      </section>`;
    }
    return `${topbar(quitBtn)}
    <section class="screen">
      <p class="eyebrow">The secret ${esc(noun())} was</p>
      <div class="answer-card stamp"><div class="secret">${esc(g.secret)}</div></div>
      <h2 style="font-size:clamp(30px,9vw,40px)">Did ${esc(imp)} get it right?</h2>
      <div class="spacer"></div>
      <div class="btn-row">
        <button class="btn ghost" data-act="guess" data-ok="0">No</button>
        <button class="btn red" data-act="guess" data-ok="1">Yes</button>
      </div>
    </section>`;
  },

  result() {
    const g = S.game, imp = g.players[g.imposter];
    const head = {
      safe: ["Safe players win", `${esc(imp)} was caught and couldn't name the ${esc(noun())}.`],
      wrong: ["Imposter wins", g.accused !== null ? `You accused ${esc(g.players[g.accused])}, but they were safe.` : ""],
      hung: ["Imposter wins", "The vote stayed tied, so nobody was accused."],
      guessed: ["Imposter wins", `${esc(imp)} was caught but named the ${esc(noun())}.`]
    }[g.outcome];
    const board = Object.entries(S.scores).filter(([p]) => S.players.includes(p)).sort((a, b) => b[1] - a[1])
      .map(([p, s]) => `<tr><td>${esc(p)}</td><td>${s}</td></tr>`).join("");
    return `${topbar()}
    <section class="screen">
      <div class="verdict ${g.outcome === "safe" ? "safe-win" : "imp-win"} stamp">
        <div class="big">${head[0]}</div><p>${head[1]}</p>
      </div>
      ${g.outcome === "safe" ? host("safe") : host("imposter", [esc(imp)], { pose: "card" })}
      <dl class="facts">
        <dt>Imposter</dt><dd>${esc(imp)}</dd>
        <dt>${esc(noun())}</dt><dd>${esc(g.secret)}</dd>
      </dl>
      <div class="panel">
        <div class="panel-head"><span class="label">Wins tonight</span><button class="text-link" style="padding:0" data-act="reset-scores">Reset</button></div>
        <table class="table"><tbody>${board}</tbody></table>
      </div>
      <div class="spacer"></div>
      <button class="btn" data-act="again">Play again</button>
      <button class="btn ghost" data-act="to-setup">Change players</button>
    </section>`;
  }
};

let confirmOpen = null;
function render({ focusName = false } = {}) {
  applyTheme();
  const app = $("#app");
  const oldInput = $("#name-input");
  const typed = oldInput ? oldInput.value : "";
  const hadFocus = oldInput && document.activeElement === oldInput;
  app.innerHTML = views[S.screen]() + (confirmOpen ? `
    <div class="sheet-wrap" data-act="cancel-sheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(confirmOpen.title)}">
      <h2 style="font-size:34px">${esc(confirmOpen.title)}</h2><p class="muted">${esc(confirmOpen.body)}</p>
      <div class="btn-row"><button class="btn ghost" data-act="cancel-sheet">Keep playing</button><button class="btn red" data-act="${confirmOpen.act}">${esc(confirmOpen.ok)}</button></div>
    </div></div>` : "");
  const newInput = $("#name-input");
  if (newInput) {
    if (typed) newInput.value = typed;
    if (focusName || hadFocus) newInput.focus({ preventScroll: true });
  }
  if (S.screen === "pass" && S.game.revealOpen) {
    requestAnimationFrame(() => requestAnimationFrame(() => { const c = $("#card"); if (c) c.classList.add("on"); }));
  }
}

/* ---------- events ---------- */
function addName() {
  const input = $("#name-input"), hint = $("#name-hint");
  if (!input) return;
  const name = input.value.trim().replace(/\s+/g, " ");
  if (!name) { hint.textContent = "Type a name first, then tap Add."; hint.className = "hint warn"; input.focus(); return; }
  if (S.players.some(p => p.toLowerCase() === name.toLowerCase())) { hint.textContent = `${name} is already playing. Try a nickname.`; hint.className = "hint warn"; input.focus(); return; }
  S.players.push(name); save(); sound.tap();
  input.value = "";
  render({ focusName: true });
}
document.addEventListener("submit", e => { e.preventDefault(); if (e.target.id === "add-form") addName(); });
document.addEventListener("keydown", e => {
  if (e.target.id === "name-input" && e.key === "Enter") { e.preventDefault(); addName(); }
});

document.addEventListener("change", e => {
  if (e.target.id === "cat-select") S.category = e.target.value;
});

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, g = S.game;
  if (act === "cancel-sheet" && e.target.closest(".sheet") && el.classList.contains("sheet-wrap")) return;
  sound.ensure();
  switch (act) {
    case "sound": sound.on = !sound.on; store.set("sound", sound.on); render(); break;
    case "home": go("home"); break;
    case "to-setup": go("setup"); setTimeout(() => { const i = $("#name-input"); if (i && S.players.length < MIN_PLAYERS) i.focus(); }, 50); break;
    case "add-name": addName(); break;
    case "remove": S.players.splice(+el.dataset.i, 1); save(); render({ focusName: true }); break;
    case "rounds": S.rounds = Math.min(6, Math.max(1, S.rounds + +el.dataset.d)); save(); $("#rounds-out").textContent = S.rounds; break;
    case "cat": if (document.activeElement) document.activeElement.blur(); S.category = el.dataset.k; render(); break;
    case "start":
      if (S.players.length < MIN_PLAYERS) { const i = $("#name-input"); i.scrollIntoView({ block: "center", behavior: "smooth" }); i.focus({ preventScroll: true }); break; }
      if (!S.category) { const c = $(".cat-grid"); c.scrollIntoView({ block: "center", behavior: "smooth" }); c.animate?.([{ transform: "translateX(0)" }, { transform: "translateX(-6px)" }, { transform: "translateX(6px)" }, { transform: "translateX(0)" }], { duration: 300 }); break; }
      sound.whistle(.35); newGame(); break;
    case "open-card": g.revealOpen = true; render(); setTimeout(() => sound.reveal(false), 250); /* same sound for everyone so the imposter isn't given away */ break;
    case "hide-card":
      g.revealOpen = false; sound.tap();
      if (g.revealIdx < g.players.length - 1) { g.revealIdx++; go("pass"); }
      else { sound.whistle(.6); go("clues"); }
      break;
    case "next-turn":
      sound.tap();
      if (g.turn < g.order.length - 1) g.turn++;
      else if (g.round < S.rounds) { g.round++; g.turn = 0; sound.whistle(.25); }
      else { sound.whistle(.8); g.voteIdx = 0; g.votes = []; go("vote"); return; }
      render(); break;
    case "skip-vote": sound.whistle(.8); g.voteIdx = 0; g.votes = []; go("vote"); break;
    case "cast":
      sound.tap(); g.votes.push(+el.dataset.i);
      if (g.voteIdx < g.players.length - 1) { g.voteIdx++; go("vote"); } else go("tally");
      break;
    case "revote": { const t = tallyVotes(); g.candidates = t.top; g.revote = true; g.voteIdx = 0; g.votes = []; go("vote"); break; }
    case "accuse": {
      const i = +el.dataset.i; g.accused = i;
      if (i === g.imposter) { sound.reveal(true); go("caught"); } else finish("wrong");
      break;
    }
    case "hung": finish("hung"); break;
    case "show-answer": g.guessed = "pending"; sound.tap(); render(); break;
    case "guess": finish(el.dataset.ok === "1" ? "guessed" : "safe"); break;
    case "again": newGame(); break;
    case "reset-scores": S.scores = {}; save(); render(); break;
    case "quit": confirmOpen = { title: "Quit this game?", body: "The current round ends and nobody scores.", ok: "Quit game", act: "confirm-quit" }; render(); break;
    case "cancel-sheet": confirmOpen = null; render(); break;
    case "confirm-quit": confirmOpen = null; S.game = null; go("setup"); break;
  }
});

/* ---------- boot (keeps a game in progress across page updates) ---------- */
function start(data) {
  if (data && data.S) S = Object.assign(S, data.S);
  if (S.screen !== "home" && S.screen !== "setup" && !S.game) S.screen = "home";
  render();
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
